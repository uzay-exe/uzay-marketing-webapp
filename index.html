<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>Uzay Marketing</title>
<link rel="stylesheet" href="style.css?v=8" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Uzay <span>Marketing</span></div>
  </header>

  <section class="slider" id="slider">
    <div class="slide active" style="background-image: url('images/slide-truvabet.jpg')" data-url="http://tinyurl.com/truvagiris" role="button" tabindex="0" aria-label="Truvabet">
      <span class="slide-cta">Geçmek</span>
    </div>
    <div class="slide" style="background-image: url('images/slide-venusbet.png')" data-url="http://tinyurl.com/venusgiris" role="button" tabindex="0" aria-label="Venüsbet">
      <span class="slide-cta">Geçmek</span>
    </div>
    <div class="slide" style="background-image: url('images/slide-ronabet.jpg')" data-url="https://ronabet.io/" role="button" tabindex="0" aria-label="Ronabet">
      <span class="slide-cta">Geçmek</span>
    </div>
    <button class="slider-next" id="slider-next" aria-label="Sonraki slayt">›</button>
    <div class="slider-dots"></div>
  </section>

  <main>
    <div class="card">
      <h3>Uzay Marketing'e Hoş Geldin</h3>
      <p>Bu alan yakında ürün ve kampanya içerikleriyle dolacak. Alttaki menüden Haberler ve Ortaklıklar sayfalarına göz atabilirsin.</p>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="active">
      <span class="bn-icon">🏠</span>
      <span class="bn-label">Anasayfa</span>
    </a>
    <a href="haberler.html">
      <span class="bn-icon">📰</span>
      <span class="bn-label">Haberler</span>
    </a>
    <a href="ortakliklar.html">
      <span class="bn-icon">🤝</span>
      <span class="bn-label">Ortaklıklar</span>
    </a>
    <a href="oyunlar.html">
      <span class="bn-icon">🎮</span>
      <span class="bn-label">Oyunlar</span>
    </a>
  </nav>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const slides = document.querySelectorAll('.slide');
    const dotsWrap = document.querySelector('.slider-dots');
    slides.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dotsWrap.appendChild(dot);
    });
    const dots = document.querySelectorAll('.dot');

    let current = 0;
    function showSlide(i) {
      slides[current].classList.remove('active');
      dots[current].classList.remove('active');
      current = i;
      slides[current].classList.add('active');
      dots[current].classList.add('active');
    }

    let autoplay = setInterval(() => showSlide((current + 1) % slides.length), 4000);
    function restartAutoplay() {
      clearInterval(autoplay);
      autoplay = setInterval(() => showSlide((current + 1) % slides.length), 4000);
    }

    slides.forEach((slide) => {
      slide.addEventListener('click', () => {
        const url = slide.dataset.url;
        if (url) tg.openLink(url);
      });
    });

    document.getElementById('slider-next').addEventListener('click', () => {
      showSlide((current + 1) % slides.length);
      restartAutoplay();
    });
  </script>
</body>
</html>
