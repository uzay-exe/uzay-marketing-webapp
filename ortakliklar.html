<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>Ortaklıklar · Uzay Marketing</title>
<link rel="stylesheet" href="style.css?v=7" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Uzay <span>Marketing</span></div>
  </header>

  <main>
    <div class="card">
      <span class="badge">Ortaklık</span>
      <h3>Bizimle çalışmak ister misin?</h3>
      <p>İş birliği ve ortaklık teklifleri için bize Telegram üzerinden ulaşabilirsin.</p>
    </div>
    <button class="cta" id="contact">İletişime Geç</button>
  </main>

  <nav class="bottom-nav">
    <a href="index.html">
      <span class="bn-icon">🏠</span>
      <span class="bn-label">Anasayfa</span>
    </a>
    <a href="haberler.html">
      <span class="bn-icon">📰</span>
      <span class="bn-label">Haberler</span>
    </a>
    <a href="ortakliklar.html" class="active">
      <span class="bn-icon">🤝</span>
      <span class="bn-label">Ortaklıklar</span>
    </a>
    <a href="oyunlar.html">
      <span class="bn-icon">🎮</span>
      <span class="bn-label">Oyunlar</span>
    </a>
  </nav>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    document.getElementById('contact').addEventListener('click', () => {
      tg.openTelegramLink('https://t.me/UzayMR');
    });
  </script>
</body>
</html>
