<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>Ortaklıklar · Uzay Marketing</title>
<link rel="stylesheet" href="style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Uzay <span>Marketing</span></div>
  </header>

  <nav class="tabs">
    <a href="index.html">Anasayfa</a>
    <a href="haberler.html">Haberler</a>
    <a href="ortakliklar.html" class="active">Ortaklıklar</a>
    <a href="oyunlar.html">Oyunlar</a>
  </nav>

  <main>
    <div class="card">
      <span class="badge">Ortaklık</span>
      <h3>Bizimle çalışmak ister misin?</h3>
      <p>İş birliği ve ortaklık detayları yakında burada yer alacak.</p>
    </div>
    <button class="cta" id="contact">İletişime Geç</button>
  </main>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    document.getElementById('contact').addEventListener('click', () => {
      tg.close();
    });
  </script>
</body>
</html>
