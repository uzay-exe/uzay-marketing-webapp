<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>Oyunlar · Uzay Marketing</title>
<link rel="stylesheet" href="style.css?v=9" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Uzay <span>Marketing</span></div>
    <div class="token-pill">🪙 <span id="token-balance">0</span></div>
  </header>

  <main>
    <a class="card game-card" href="cark.html">
      <div class="game-card-icon mini-wheel"></div>
      <div class="game-card-body">
        <h3>Bedava Çark <span class="badge badge-inline">DEMO</span></h3>
        <p>Günde bir kez çevir, dilime göre token kazan.</p>
      </div>
    </a>

    <div class="empty-state">
      <div class="icon">🎮</div>
      <p>Diğer oyunlar çok yakında burada olacak.</p>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html">
      <span class="bn-icon">🏠</span>
      <span class="bn-label">Anasayfa</span>
    </a>
    <a href="haberler.html">
      <span class="bn-icon">📰</span>
      <span class="bn-label">Haberler</span>
    </a>
    <a href="ortakliklar.html">
      <span class="bn-icon">🤝</span>
      <span class="bn-label">Ortaklıklar</span>
    </a>
    <a href="oyunlar.html" class="active">
      <span class="bn-icon">🎮</span>
      <span class="bn-label">Oyunlar</span>
    </a>
  </nav>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const balance = parseInt(localStorage.getItem('demo_token_balance') || '1000', 10);
    document.getElementById('token-balance').textContent = balance.toLocaleString('tr-TR');
  </script>
</body>
</html>
