<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>Haberler · Uzay Marketing</title>
<link rel="stylesheet" href="style.css?v=9" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Uzay <span>Marketing</span></div>
  </header>

  <main>
    <div id="news-list" class="empty-state">
      <div class="icon">📰</div>
      <p>Haberler yükleniyor...</p>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html">
      <span class="bn-icon">🏠</span>
      <span class="bn-label">Anasayfa</span>
    </a>
    <a href="haberler.html" class="active">
      <span class="bn-icon">📰</span>
      <span class="bn-label">Haberler</span>
    </a>
    <a href="ortakliklar.html">
      <span class="bn-icon">🤝</span>
      <span class="bn-label">Ortaklıklar</span>
    </a>
    <a href="oyunlar.html">
      <span class="bn-icon">🎮</span>
      <span class="bn-label">Oyunlar</span>
    </a>
  </nav>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function formatDate(pubDate) {
      const d = new Date(pubDate);
      if (isNaN(d)) return '';
      return d.toLocaleDateString('tr-TR', { day: '2-digit', month: 'long', hour: '2-digit', minute: '2-digit' });
    }

    fetch('news.json?t=' + Date.now())
      .then((r) => r.json())
      .then((data) => {
        const list = document.getElementById('news-list');
        if (!data.items || !data.items.length) {
          list.innerHTML = '<div class="icon">📰</div><p>Henüz haber eklenmedi.</p>';
          return;
        }
        list.classList.remove('empty-state');
        list.innerHTML = data.items
          .map(
            (item, i) => `
          <a class="card news-card" href="haber-detay.html?i=${i}">
            ${item.image ? `<img class="news-thumb" src="${item.image}" alt="" loading="lazy" />` : ''}
            <span class="badge">${formatDate(item.pubDate)}</span>
            <h3>${item.title}</h3>
            <p>${item.description}</p>
          </a>`
          )
          .join('');
      })
      .catch(() => {
        const list = document.getElementById('news-list');
        list.innerHTML = '<div class="icon">📰</div><p>Haberler şu an yüklenemedi.</p>';
      });
  </script>
</body>
</html>
